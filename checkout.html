<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — Zartz</title><link rel="stylesheet" href="css/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="js/config.js"></script><script defer src="js/checkout.js"></script></head><body><header class="site-header"><a class="brand" href="index.html"><img src="https://cdn-icons-png.flaticon.com/512/2779/2779764.png" alt=""><span>Zartz</span></a></header><main class="page narrow"><div class="page-heading"><p class="eyebrow">SECURE CHECKOUT</p><h1>Complete your order</h1></div><form id="checkout-form" class="form-card"><label>Full name<input name="name" class="input" required></label><label>Email<input name="email" type="email" class="input" required></label><label>Phone<input name="phone" class="input" required></label><label>Country<input name="country" class="input" required></label><label>Address<textarea name="address" class="input" rows="4" required></textarea></label><div id="checkout-summary"></div><button class="button button-dark" type="submit">Pay with Paystack</button><p id="checkout-status" class="status"></p></form></main></body></html>
