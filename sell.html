<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sell on Zartz</title><link rel="stylesheet" href="css/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="js/config.js"></script><script defer src="js/sell.js"></script></head><body><header class="site-header"><a class="brand" href="index.html"><img src="https://cdn-icons-png.flaticon.com/512/2779/2779764.png" alt=""><span>Zartz</span></a><nav class="main-nav"><a href="shop.html">Shop</a><a href="artists.html">Artists</a><a href="exhibitions.html">Exhibitions</a><a href="journal.html">Journal</a></nav><div class="header-actions"><a class="active" href="sell.html">Sell</a><a href="login.html">Sign in</a><a href="cart.html">Cart <span data-cart-count>0</span></a></div></header><main class="page narrow"><div class="page-heading"><p class="eyebrow">FOR ARTISTS</p><h1>List an artwork</h1><p>Publish an original work to the Zartz marketplace.</p></div><form id="sell-form" class="form-card"><label>Title<input name="title" class="input" required></label><label>Artist name<input name="artist_name" class="input" required></label><label>Category<select name="category" class="input" required><option>Painting</option><option>Photography</option><option>Print</option><option>Sculpture</option><option>Drawing</option><option>Mixed Media</option></select></label><label>Price<input name="price" type="number" min="0" step="0.01" class="input" required></label><label>Currency<select name="currency" class="input"><option>USD</option><option>GHS</option><option>EUR</option><option>GBP</option></select></label><label>Image URL<input name="image_url" type="url" class="input" placeholder="https://..." required></label><label>Description<textarea name="description" class="input" rows="6"></textarea></label><button class="button button-dark" type="submit">Publish artwork</button><p id="sell-status" class="status"></p></form></main></body></html>
